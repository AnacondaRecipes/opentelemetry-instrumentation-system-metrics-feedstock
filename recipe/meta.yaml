{% set name = "opentelemetry-instrumentation-system-metrics" %}
{% set version = "0.66b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_system_metrics-{{ version }}.tar.gz
  sha256: b0fccbc1aecf35c182431a035ec4809b8f9607eec692243cf70f23b3bda51231

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  skip: true # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-instrumentation =={{ version }}
    - opentelemetry-api >=1.11,<2.0.0
    - opentelemetry-semantic-conventions =={{ version }}
    - psutil >=5.9.0,<8

# Tests disabled: they import opentelemetry.test.test_base, shipped by
# opentelemetry-test-utils, which is not in the main channel.
test:
  imports:
    - opentelemetry.instrumentation.system_metrics
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-system-metrics
  summary: OpenTelemetry Python Instrumentation for System Metrics
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  description: |
    This package provides entrypoints to configure OpenTelemetry.
  doc_url: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-system-metrics
  dev_url: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-system-metrics

extra:
  recipe-maintainers:
    - rxm7706
    - arishamays1
